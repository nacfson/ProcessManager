apiVersion: apps/v1
kind: Deployment
metadata:
  name: processmanager
  namespace: nacfson-personal
  labels:
    app.kubernetes.io/name: processmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processmanager
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: processmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: manager
          image: 192.168.219.100:5000/processmanager:latest
          imagePullPolicy: IfNotPresent
          command: ["./manager"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.nacfson-auth.svc.cluster.local:8080"
            - name: AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-auth-secrets
                  key: AUTH_INTERNAL_TOKEN
            - name: SHARED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-app-db-secrets
                  key: DATABASE_URL
                  optional: true
          args:
            - -domain=nacfson.cloud
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
