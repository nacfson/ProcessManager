apiVersion: apps/v1
kind: Deployment
metadata:
  name: processmanager
  namespace: nacfson-personal
  labels:
    app.kubernetes.io/name: processmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processmanager
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: processmanager
      containers:
        - name: manager
          image: 192.168.219.100:5000/processmanager:latest
          imagePullPolicy: IfNotPresent
          command: ["./manager"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: manager-auth-db-secrets
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: manager-auth-db-secrets
                  key: DATABASE_URL
                  optional: true
            - name: SHARED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-app-db-secrets
                  key: DATABASE_URL
          args:
            - -namespace=nacfson-personal
            - -domain=nacfson.cloud
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
