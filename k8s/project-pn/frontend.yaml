apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-pn-frontend
  namespace: project-pn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-pn-frontend
      app.kubernetes.io/part-of: project-pn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-pn-frontend
        app.kubernetes.io/part-of: project-pn
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: nginx
          image: project-pn-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: project-pn-nginx
