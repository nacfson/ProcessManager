apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-pn
  namespace: project-pn
  annotations:
    # Project PN uses bearer-token auth validated by its own backend;
    # cookie-based ingress auth is disabled so API calls with Authorization
    # headers reach the backend instead of being rejected here.
spec:
  ingressClassName: nginx
  rules:
    - host: pn.nacfson.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project-pn-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - pn.nacfson.cloud
      secretName: pn-tls
