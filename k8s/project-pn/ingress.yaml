apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-pn
  namespace: project-pn
  annotations:
    # The SPA shell remains public. Project PN's backend authenticates /api
    # requests from the shared nacfson_session cookie (or native bearer
    # tokens) after the browser returns from central auth.
spec:
  ingressClassName: nginx
  rules:
    - host: pn.nacfson.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project-pn-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - pn.nacfson.cloud
      secretName: pn-tls
