apiVersion: apps/v1
kind: Deployment
metadata:
  name: enricher
  namespace: project-pn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enricher
      app.kubernetes.io/part-of: project-pn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enricher
        app.kubernetes.io/part-of: project-pn
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: enricher
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/dictionary_enricher.py
          ports:
            - containerPort: 8787
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: project-pn-secrets
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: project-pn-secrets
                  key: GEMINI_MODEL
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: project-pn-secrets
                  key: DEEPSEEK_API_KEY
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef:
                  name: project-pn-secrets
                  key: DEEPSEEK_MODEL
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: enricher-script
