apiVersion: batch/v1
kind: Job
metadata:
  name: health-migrate
  namespace: health
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-migrate
        app.kubernetes.io/part-of: health
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: OnFailure
      initContainers:
        # Shared-app Postgres; pg_isready only checks the server accepts
        # connections (the `health` DB must already be provisioned).
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h shared-app-db.nacfson-data -p 5432 -U health; do
                echo "Waiting for shared-app-db..."
                sleep 2
              done
      containers:
        - name: migrate
          image: 192.168.219.100:5000/health-api:latest
          imagePullPolicy: Always
          # `seed` is an idempotent upsert of the master exercise dataset.
          command: ["sh", "-c", "./migrate up && ./migrate seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: DATABASE_URL
            - name: MIGRATIONS_PATH
              value: file://db/migrations