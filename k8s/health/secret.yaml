apiVersion: v1
kind: Secret
metadata:
  name: health-secrets
  namespace: health
type: Opaque
stringData:
  # Shared-app Postgres DB `health` (provisioned via the ProcessManager DB UI).
  DATABASE_URL: "postgres://health:REPLACE_WITH_ROTATED_PASSWORD@shared-app-db.nacfson-data:5432/health?sslmode=require"
  APP_PUBLIC_URL: "https://health.nacfson.cloud"
  # Add local dev origins here if needed, comma-separated.
  ALLOWED_ORIGINS: "https://health.nacfson.cloud"
  CENTRAL_AUTH_URL: "https://auth.nacfson.cloud"
  CENTRAL_AUTH_INTERNAL_URL: "http://auth-service.nacfson-auth.svc.cluster.local:8080"
  AUTH_SESSION_INTERNAL_TOKEN: "REPLACE_WITH_SAME_SESSION_VERIFIER_TOKEN_AS_AUTH_SERVICE"