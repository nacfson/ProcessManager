apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
  namespace: portfolio-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-web
      app.kubernetes.io/part-of: portfolio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-web
        app.kubernetes.io/part-of: portfolio-web
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: web
          image: portfolio-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: portfolio-web-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portfolio-data
