apiVersion: v1
kind: Service
metadata:
  name: shared-app-db
  namespace: nacfson-data
  labels:
    app.kubernetes.io/name: shared-app-db
    app.kubernetes.io/part-of: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shared-app-db
    app.kubernetes.io/part-of: data
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shared-app-db
  namespace: nacfson-data
  labels:
    app.kubernetes.io/name: shared-app-db
    app.kubernetes.io/part-of: data
spec:
  serviceName: shared-app-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shared-app-db
      app.kubernetes.io/part-of: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-app-db
        app.kubernetes.io/part-of: data
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: shared-app-db-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
