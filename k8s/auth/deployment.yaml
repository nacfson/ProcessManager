apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nacfson-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/part-of: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: auth
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: auth
          image: ghcr.io/nacfson/processmanager:latest
          imagePullPolicy: Always
          command: ["./auth-service"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: auth-db-secrets
            - secretRef:
                name: auth-bootstrap
            - secretRef:
                name: auth-smtp
          env:
            - name: PORT
              value: "8080"
            - name: COOKIE_DOMAIN
              value: "nacfson.cloud"
            - name: SESSION_LIFETIME
              value: "168h"
            - name: MAGIC_LINK_TTL
              value: "15m"
            - name: AUTH_API_ALLOWED_ORIGINS
              value: "https://pn.nacfson.cloud"
            - name: AUTH_ALLOWED_REDIRECTS
              value: "http://localhost:8081,projectpn://auth"
            - name: AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: auth-bootstrap
                  key: AUTH_INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
