# Create this secret in each namespace that pulls ghcr.io/nacfson/processmanager.
# Example:
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=nacfson \
#     --docker-password="$GHCR_TOKEN" \
#     -n nacfson-auth
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=nacfson \
#     --docker-password="$GHCR_TOKEN" \
#     -n nacfson-personal
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: nacfson-auth
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "nacfson",
          "password": "REPLACE_WITH_GHCR_TOKEN",
          "auth": "REPLACE_WITH_BASE64_OF_nacfson:TOKEN"
        }
      }
    }
