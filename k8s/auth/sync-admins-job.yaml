apiVersion: batch/v1
kind: Job
metadata:
  name: sync-admins
  namespace: nacfson-auth
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: sync-admins
          image: ghcr.io/nacfson/processmanager:latest
          imagePullPolicy: Always
          command: ["./sync-admins"]
          envFrom:
            - secretRef:
                name: auth-db-secrets
          volumeMounts:
            - name: admin-users
              mountPath: /etc/auth
              readOnly: true
      volumes:
        - name: admin-users
          secret:
            secretName: auth-admin-users
