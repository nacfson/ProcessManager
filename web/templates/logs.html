{{template "layout" .}}

{{define "content"}}
<div class="card">
    <h2>Logs: {{.Name}}</h2>
    <pre style="background:#0f172a; padding:1rem; border-radius:0.375rem; overflow:auto; max-height:60vh;">{{.Logs}}</pre>
    <a href="/" class="btn" style="background:#334155; color:#fff; margin-top:1rem;">Back</a>
</div>
{{end}}
