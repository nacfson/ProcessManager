{{define "process-row.html"}}
<tr id="process-{{.Name}}">
    <td>{{.Name}}</td>
    <td>{{.Image}}</td>
    <td>{{.Arch}}</td>
    <td>
        <span class="status {{if eq .Ready .Total}}ready{{else}}pending{{end}}">
            {{.Ready}}/{{.Total}} ready
        </span>
    </td>
    <td><a href="{{.PublicURL}}" target="_blank">{{.PublicURL}}</a></td>
    <td>
        <a href="/processes/{{.Name}}/logs" class="btn" style="background:#334155; color:#fff;">Logs</a>
        <button class="btn btn-danger"
                hx-post="/processes/{{.Name}}/delete"
                hx-confirm="Delete {{.Name}}?"
                hx-target="#process-{{.Name}}"
                hx-swap="outerHTML">Delete</button>
    </td>
</tr>
{{end}}
