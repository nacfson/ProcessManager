<tr id="process-{{.Name}}">
    <td><a href="/projects/{{.Project}}/processes/{{.Name}}/detail">{{.Name}}</a></td>
    <td>{{.Image}}</td>
    <td>{{.Arch}}</td>
    <td>
        <span hx-get="/projects/{{.Project}}/processes/{{.Name}}/status" hx-trigger="every 3s" hx-swap="innerHTML">
            {{template "pages/processes/status" dict "Status" "pending" "Label" "..."}}
        </span>
    </td>
    <td>{{.Restarts}}</td>
    <td><a href="{{.PublicURL}}" target="_blank">{{.PublicURL}}</a></td>
    <td>
        <a href="/projects/{{.Project}}/processes/{{.Name}}/logs">Logs</a>
        <button class="btn btn-danger" hx-post="/projects/{{.Project}}/processes/{{.Name}}/delete" hx-target="#process-{{.Name}}" hx-swap="outerHTML" hx-confirm="Delete {{.Name}}?" style="margin-left:0.5rem;">Delete</button>
    </td>
</tr>
