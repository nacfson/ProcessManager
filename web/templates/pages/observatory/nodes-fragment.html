{{range .Nodes}}
<div style="border: 1px solid #334155; border-radius: 0.375rem; padding: 1rem; background: rgba(30, 41, 59, 0.5);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <strong style="font-size: 1rem; color: var(--text);">{{.Name}}</strong>
        <span class="status {{if .Ready}}ready{{else}}error{{end}}" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">
            {{if .Ready}}Ready{{else}}Not Ready{{end}}
        </span>
    </div>
    <div style="font-size: 0.875rem; color: var(--muted); margin-bottom: 0.75rem;">
        Arch: <span style="color: var(--text);">{{.Arch}}</span>
    </div>
    
    <div style="font-size: 0.825rem; color: var(--muted);">CPU Usage</div>
    <div class="progress-bar-container">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill {{if ge .CPUPercent 0}}{{barClass .CPUPercent}}{{end}}" style="width: {{if ge .CPUPercent 0}}{{.CPUPercent}}{{else}}0{{end}}%;"></div>
        </div>
        <span style="font-size: 0.825rem; color: var(--text); min-width: 32px; text-align: right;">
            {{if ge .CPUPercent 0}}{{.CPUPercent}}%{{else}}N/A{{end}}
        </span>
    </div>

    <div style="font-size: 0.825rem; color: var(--muted); margin-top: 0.5rem;">Memory Usage</div>
    <div class="progress-bar-container">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill {{if ge .MemPercent 0}}{{barClass .MemPercent}}{{end}}" style="width: {{if ge .MemPercent 0}}{{.MemPercent}}{{else}}0{{end}}%;"></div>
        </div>
        <span style="font-size: 0.825rem; color: var(--text); min-width: 32px; text-align: right;">
            {{if ge .MemPercent 0}}{{.MemPercent}}%{{else}}N/A{{end}}
        </span>
    </div>
</div>
{{else}}
<div class="empty" style="grid-column: 1 / -1;">No cluster nodes found.</div>
{{end}}
