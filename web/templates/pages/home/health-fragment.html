{{range .Processes}}
<div class="card" style="margin-bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 1rem; border: 1px solid #334155; background: var(--panel);">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
        <span class="status-dot {{.HealthStatus}}" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: {{if eq .HealthStatus "healthy"}}#4ade80{{else if eq .HealthStatus "degraded"}}#facc15{{else}}#f87171{{end}};" title="{{.HealthStatus}}"></span>
        <a href="/processes/{{.Name}}/detail" style="font-weight: 600; text-decoration: none; color: var(--accent);">{{.Name}}</a>
    </div>
    <div style="display: flex; align-items: center; gap: 1.5rem; font-size: 0.875rem;">
        <span style="color: var(--muted);">{{.Ready}}/{{.Total}} Ready</span>
        {{if gt .Restarts 0}}
        <span style="background: rgba(248, 113, 113, 0.1); color: var(--danger); padding: 0.125rem 0.5rem; border-radius: 0.25rem;">{{.Restarts}} restarts</span>
        {{end}}
    </div>
</div>
{{else}}
<div class="empty" style="grid-column: 1 / -1; width: 100%;">
    <p>No processes found.</p>
</div>
{{end}}
