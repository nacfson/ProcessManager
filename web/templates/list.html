{{template "layout" .}}

{{define "content"}}
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Processes</h2>
        <a href="/processes/new" class="btn btn-primary">New Process</a>
    </div>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Image</th>
                <th>Arch</th>
                <th>Status</th>
                <th>URL</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="process-list">
            {{range .Processes}}
                {{template "process-row.html" .}}
            {{else}}
                <tr><td colspan="6" style="text-align:center; color:#94a3b8;">No processes yet.</td></tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
